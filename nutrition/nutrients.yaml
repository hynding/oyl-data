# Canonical nutrient list for OYL.
#
# Every nutrient value anywhere in this repo is keyed by an `id` from this file
# and expressed in that nutrient's `unit`. Sources (OFF, USDA FDC) are mapped
# onto these ids at extract time; nothing downstream should know source keys.
#
# `dv` = FDA Daily Value for adults and children ≥ 4 years (21 CFR 101.9, 2016
# rule, mandatory since 2020/2021). `null` means no DV is defined (trans fat,
# total sugars) so no %DV should be shown.
#
# `label`: required  → mandatory on a US Nutrition Facts panel
#          voluntary → may appear on the panel
#          extra     → not a label nutrient, but useful for diet tracking
#
# `off`:  key in Open Food Facts `nutriments` (without the _100g suffix).
#         OFF stores *_100g mass values in grams regardless of display unit,
#         and energy-kcal in kcal, so `scale` converts OFF grams → `unit`.
# `fdc`:  USDA FoodData Central nutrient id(s) (already in `unit`). A list means "first
#         present wins" — e.g. Foundation foods report energy only as Atwater estimates.
#
# Order here is label order; build.ts preserves it as `sort`.

- id: energy
  name: Calories
  unit: kcal
  dv: 2000
  label: required
  off: energy-kcal
  scale: 1
  fdc: [1008, 2048, 2047]   # Energy; Atwater specific; Atwater general

