 semen mango) v proměnlivých poměrech, emulgátor: lecitiny (ze sói), aroma, mléčný tuk), cukr, glukózový sirup, látka udržující vlhkost: sorbitol, rostlinný tuk (palmový, shea), etylalkohol (3,7 %), brandy (0,3 %), aroma, barvivo: přirodní karamel. Čokoláda - kakaová hmota minimálně 46 %. Čokoláda obsahuje kromě kakaového másla také rostlinné tuky. Výrobek může obsahovat arašidy, jiné druhy ořechů, veice a pšenici Výrobek obsahuje alkohol: neni vhodný pro děti a těhotné ženy."
