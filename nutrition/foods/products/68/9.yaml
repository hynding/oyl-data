  ingredients:
    text: "PLŹródło wapnia oraz witaminy B2, B12 1 D2 Bogaty w błonnik Nie zawiera cukrów i substancji słodzą - cych Naturalnie niska zawartość tłuszczu. Napój owsiany z dodatkiem wapnia i witamin. SKŁADNIKI: baza owsiana (97%) [woda, owies (8,3%]). błonnik z kukurydzy, olej słoneczniko - wy, wapń, sól morska, stabilizator (guma gellan), witaminy B2, B12, D2. Naturalnie nie zawiera laktozy. Przed otwarciem wstrząsnąć. Można stoso - wać na gorąco lub zimno. Najlepiej spożyć przed: na górze opakowania. Przechowywać w temperaturze od +1°C do +25°C. Po otwarciu przechowy - wać w lodówce w temperaturze od +1°C do +7°C, nie dłużej niż 5 dni. © Източник на калций и вита - мини В2, В12, D2 • Високо съдър - жание на хранителни влакнини • Без съдържание на захари или подсладители • Натурално ниско съдържание на мазнини. Овесена напитка с добавени калций и вита - мини. СЪСТАВКИ: овесена основа (97%) (вода, овес (8,3%)), разтвори - ми царевични влакнини, слънчогле - дово масло, калций (калциев карбо - нат), морска сол, стабилизатор (гума джелан), витамини В2, В12, D2. Не съдържа мляко и млечни про - дукти. Натурално несъдържащо лактоза. Разклатете добре. Може да се използва топло или студено, в обичайните ви рецепти. Най-добър до: виж отгоре на опаковката. Съх - ранявайте при температура от +1°С до +25°С. След отваряне, съхраня - вайте в хладилник между +1°С и +7°С и използвайте до 5 дни. CZ Zdroj vápníku a vitaminů B2, B12, D2 S vysokým obsahem vlákniny ⚫ Bez cukru a sladidel Přirozeně s nízkým obsahem tuku. Ovesný nápoj, zdroj vápníku a vitaminů. SLOŽENÍ: ovesná složka (97%) (pitná voda, oves (8,3%]), rozpustná kukuřičná vláknina, slunečnicový olej, vápník (uhličitan vápenatý), mořská sůl, stabilizátor (guma gellan), vitaminy B2, B12, D2. Při - rozeně bez laktózy. Laktóza 0 g. Před použitím protřepejte. Produkt je možné použít za tepla i za studena, vhodný na kulinářské využití jako možná alternati - va mléka. Minimální trvanlivost do: viz horní strana obalu. Uchovávejte při tep - lotě do max. 25 °C. Po otevření ucho - vejte v chladničce při teplotě od 1°C do 7°C a spotřebujte do 5 dnů. SK Zdroj vápnika a vitamínov B2, B12, D2 S vysokým obsahom vlákni - ny Bez cukru a sladidiel Prirodze - ne s nízkym obsahom tuku. Ovsený nápoj, zdroj vápnika a vitamínov. ZLOŽENIE: Ovsená zložka (97%) (pitná voda, ovos (8,3%]), rozpustná kukurič - ná vláknina, slnečnicový olej, vápnik (uhličitan vápenatý), morská soľ, stabili - zátor (guma gellan), vitamíny B2, B12, D2. Prirodzene bez laktózy. Laktóza 0 g. Pred použitím pretrepte. Produkt je možné použiť za tepla aj studena, vhodný na kulinárske využitie ako možná alternativa mlieka. Minimálna trvanlivost do: vid horná strana balenia. Uchovávajte pri teplote do max. 25 °C. Po otvorení uchovajte v chladničke pri teplote od 1°C do 7°C a spotrebujte do 5 dní. HU Kalcium-, B2-, B12 - és D2-vitamin-forrás. Rostban gazdag Cukrot vagy édesítőszert nem tartalmaz Zsírszegény. Cukormentes zabital hozzáadott kalciummal és vitaminokkal. ÖSSZETEVŐK: zab összetevő (97%) (ivóvíz, zab (8,3%]), oldható kukoricarost, napraforgóolaj, kal - cium (kalcium-karbonát), tengeri só, stabilizátor (gellángumi), B2-vitamin, B12-vitamin, D2-vitamin. Nem tartalmaz tejterméket. Természetes módon laktózmentes. Fogyasztás előtt jól rázza fel! Hasz - nálható hidegen vagy melegen, bármely étke - zéshez vagy főzési célra. Minőségét megőrzi: lásd a csomagolás tetején (nap/hónap/év). Tárolási hómérséklet: +1°C és +25°C között. Felbontás után tárolja hűtőszekrényben +1°C és +7°C között és 5 napon belül fogyassza el. . . HR BA ME Izvor kalcija i vitamina B2, B12 i D2 Bogato vlaknima Bez šećera i sladila Pri - rodno s niskim sadržajem masti. Napitak od zobi s dodanim kalcijem i vitaminima. SASTOJCI: zobena baza (97%) (voda, zob (8,3%]), topljiva kukuruzna vlakna, suncokretovo ulje, kalcij (kalci - jev karbonat), morska sol, stabilizator (gellan guma), vitamini B2, B12, D2. Bez mliječnih bjelan - čevina. Prirodno ne sadrži laktozu. Dobro protre - sti. Može se koristiti zagrijano ili ohlađeno, kao zamjena za mlijeko u svim kulinarskim receptima. Najbolje upotrijebiti do: vidjeti na vrhu pakiranja. Čuvati na temperaturi od +1°C do +25°C. Nakon otvaranja držati u hladnjaku na temperaturi od +1°C do +7°C i upotrijebiti u sljedećih 5 dana. EE Kaltsiumi - ja B2-, B12 - ja D2-vitamiinide alli - kas Kõrge kiudainesisaldusega Ei sisalda suhkruid ega magusaineid. Looduslikult madala rasvasisaldusega. Kaerajook kaltsiumi ja vitamiinidega. KOOSTISOSAD: kaerapõhine (97%) (vesi, kaer (8,3%]), lahustuvad maisikiud, päevalilleõli, kaltsium (kaltsiumkarbonaat), meresool, stabilisaator (gellankummi), vitamiinid B2, B12, D2. Piimavaba. Looduslikult laktoosivaba. Enne kasutamist raputada korralikult. Võib kasuta - da soojalt või jahutatult erinevates toiduretsepti - des. Parim enne: vaata pakendi ülaosas. Säilitada: +1°C-+25°C. Peale avamist säilitada külmkapis +1°C kuni +7°C ja tarbida 5 päeva jooksul. LV Kalcija un B2, B12 un D2 vitamīnu avots • Daudz šķiedrvielu Bez cukura un saldinātājiem Ar dabīgi zemu tauku saturu. Auzu dzēriens ar pievienotu kalciju un vitamīniem. SASTĀVDAĻAS: auzu bāze (97%) (ūdens, auzas (8,3%]), šķīstoša kukurūzas šķiedra, saulespuķu ella, kalcijs (kalcija karbonāts), jūras sāls, stabilizē - tājs (želena sveķi), vitamīni B2, B12, D2. Nesatur pienu. Dabīgi nesatur laktozi. Pirms lietošanas sakratit. Var tikt lietots karsts vai atdzesēts dažādu recepšu gatavošanā. leteicams līdz: sk.uz iepak. Uzglabāšanas temperatūra +1°C - +25°C. Pēc atvēršanas uzglabāt ledusskapī temperatūrā no +1°C līdz +7°C, izlietot 5 dienu laikā. LT Kalcio ir vitaminų B2, B12 ir D2 šaltinis. Daug skaidulinių medžiagų ⚫ Be cukrų ir saldi - klių Natūraliai mažai riebalų. Avižų gėrimas praturtintas kalciu ir vitaminais. SUDEDAMOSIOS DALYS: avižų pagrindas (97%) (vanduo, avižos (8,3%]), tirpios kukurūzų skaidulinės medžiagos, saulėgrąžų aliejus, kalcis (kalcio karbonatas), jūros druska, stabilizatorius (gelano derva), vitaminai B2, B12, D2. Sudėtyje nėra pieno. Sudėtyje natūraliai nėra laktozės. Prieš naudojimą suplakite. Galima naudoti įvairiuose receptuose karštą arba šaltą. Geriausias iki: žiūrėti ant pakuotės. Laikymo sąly - gos: +1°C-+25°C. Atidaryta laikyti šaldytuve +1°C-+7°C temperatūroje ir sunaudoti per 5 dienas. 1LeU.H.T."
