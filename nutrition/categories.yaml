# OYL's own food category tree. Deliberately shallow — it's for browsing and
# filtering, not taxonomy. Source tags are mapped onto these at extract time:
#   `off`: Open Food Facts categories_tags (a product matches if ANY tag matches;
#          the first category in this file that matches wins, so order from
#          specific to general within a group)
#   `fdc`: USDA FDC food_category (SR Legacy/Foundation) or WWEIA category (FNDDS)
#          descriptions — case-insensitive substring; first category in file order wins,
#          so put specific needles ("Fast Foods") before general ones ("Foods")
#
# Products that match nothing get `other`. Grow this file as you see what
# falls into `other` after a build (scripts/build.ts prints the top unmatched tags).

- id: produce
  name: Fruits & Vegetables
  children:
    - id: produce_other
      name: Fresh Produce
      off: [en:produce, en:fruits-and-vegetables, en:plant-based-foods]
    - id: fruit
      name: Fruit
      off: [en:fruits, en:fresh-fruits, en:dried-fruits, en:fruit-based-foods]
      fdc: [Fruits and Fruit Juices, Apples, Bananas, Grapes, Peaches and nectarines, Berries, Citrus fruits, Melons, Dried fruits, Other fruits, Pears, Pineapple, Mango and papaya, fruit salads]
    - id: vegetable
      name: Vegetables
      off: [en:vegetables, en:fresh-vegetables, en:legumes, en:canned-vegetables, en:frozen-vegetables]
      fdc: [Vegetables and Vegetable Products, Legumes and Legume Products, Tomatoes, Carrots, red and orange vegetables, Dark green vegetables, Lettuce, String beans, Onions, Corn, starchy vegetables, Other vegetables, Fried vegetables, Vegetables on a sandwich, White potatoes, French fries, Mashed potatoes, Beans, peas, legumes, Vegetable dishes, Bean, pea, legume dishes, Olives, pickles]

