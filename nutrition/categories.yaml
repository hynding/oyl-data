# OYL's own food category tree. Deliberately shallow — it's for browsing and
# filtering, not taxonomy. Source tags are mapped onto these at extract time:
#   `off`: Open Food Facts categories_tags, exact (a product matches if ANY tag matches;
#          OFF lists tags general → specific, and the LAST tag that maps wins)
#   `fdc`: USDA FDC food_category (SR Legacy/Foundation) or WWEIA category (FNDDS)
#          descriptions — the exact full name, case-insensitive. Quote them: many
#          contain commas, which a YAML flow list would split into fragments.
# A source key may appear under one category only (validate.ts checks).
#
# Products that match nothing get `other`. Grow this file as you see what
# falls into `other` after a shard (shard-products.ts / shard-generic.ts print the top
# unmatched tags and categories).

- id: produce
  name: Fruits & Vegetables
  children:
    - id: produce_other
      name: Fresh Produce
      off: [en:produce, en:fruits-and-vegetables, en:plant-based-foods]
    - id: fruit
      name: Fruit
      off: [en:fruits, en:fresh-fruits, en:dried-fruits, en:fruit-based-foods, en:fruit-puree, en:fruit-crisps]
      fdc:
        - "Fruits and Fruit Juices"
        - "Apples"
        - "Bananas"
        - "Blueberries and other berries"
        - "Citrus fruits"
        - "Dried fruits"
        - "Grapes"
        - "Mango and papaya"
        - "Melons"
        - "Other fruits and fruit salads"
        - "Peaches and nectarines"
        - "Pears"
        - "Pineapple"
        - "Strawberries"
    - id: vegetable
      name: Vegetables
      off: [en:vegetables, en:fresh-vegetables, en:legumes, en:canned-vegetables, en:frozen-vegetables, en:beans]
      fdc:
        - "Vegetables and Vegetable Products"
        - "Legumes and Legume Products"
        - "Bean, pea, legume dishes"
        - "Beans, peas, legumes"
        - "Broccoli"
        - "Cabbage"
        - "Carrots"
        - "Coleslaw, non-lettuce salads"
        - "Corn"
        - "French fries and other fried white potatoes"
        - "Fried vegetables"
        - "Lettuce and lettuce salads"
        - "Mashed potatoes and white potato mixtures"
        - "Olives, pickles, pickled vegetables"
        - "Onions"
        - "Other dark green vegetables"
        - "Other red and orange vegetables"
        - "Other starchy vegetables"
        - "Other vegetables and combinations"
        - "Spinach"
        - "String beans"
        - "Tomatoes"
        - "Vegetable dishes"
        - "Vegetables on a sandwich"
        - "White potatoes, baked or boiled"

